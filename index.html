<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Banking Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            width: 350px;
            box-shadow: 0 8px 25px #00000015;
            text-align: center;
        }

        h2 {
            color: #1e293b;
        }

        .balance {
            font-size: 38px;
            font-weight: bold;
            color: #2563eb;
            margin: 20px 0;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            width: 46%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            margin: 5px 1%;
        }

        .deposit {
            background: #16a34a;
        }

        .withdraw {
            background: #dc2626;
        }

        #message {
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Banking Dashboard</h2>
        <p>Available Balance</p>
        <div class="balance" id="balance">Loading...</div>

        <input type="number" id="amount" placeholder="Enter amount" min="1" step="0.01">

        <div>
            <button class="deposit" onclick="transact('deposit')">
                Deposit
            </button>
            <button class="withdraw" onclick="transact('withdraw')">
                Withdraw
            </button>
        </div>
        <p id="message"></p>
    </div>

    <script>
        const API = "http://localhost:8080";

        async function loadBalance() {
            try {
                const response = await fetch(API + "/balance");
                if (!response.ok) throw new Error("API unavailable");
                const data = await response.json();
                document.getElementById("balance").innerText =
                    "₹" + Number(data.balance).toFixed(2);
            } catch (error) {
                document.getElementById("balance").innerText =
                    "Server offline";
            }
        }

        async function transact(type) {
            const amount = Number(
                document.getElementById("amount").value
            );
            const message = document.getElementById("message");

            if (!Number.isFinite(amount) || amount <= 0) {
                message.innerText = "Enter a valid amount";
                return;
            }

            try {
                const response = await fetch(
                    API + "/" + type + "?amount=" + amount,
                    { method: "POST" }
                );

                if (!response.ok) {
                    throw new Error(await response.text());
                }

                message.innerText = type === "deposit"
                    ? "Deposit successful!"
                    : "Withdrawal successful!";

                document.getElementById("amount").value = "";
                await loadBalance();
            } catch (error) {
                message.innerText = "Transaction failed: " + error.message;
            }
        }

        loadBalance();
    </script>
</body>

</html>
